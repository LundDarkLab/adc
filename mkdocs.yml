site_name: Dynamic Collections Plus
site_description: Documentation of the Dynamic Collections Plus platform
site_url: https://lunddarklab.github.io/adc/
repo_url: https://github.com/LundDarkLab/adc

docs_dir: docs

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections

nav:
  - Home: index.md
  - 👤 User Guide:
      - Introduction: user/index.md
      - Getting Started: user/getting-started.md
      - Features: user/features.md
      - FAQ: user/faq.md
  - 👨‍💻 Developer Guide:
      - Overview: developer/index.md
      - Requirements: developer/requirements.md
      - Installation: developer/installation.md
      - Architecture: developer/architecture.md
      - API: developer/api.md
      - Maintenance: developer/maintenance.md
      - About: developer/about.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - codehilite
  - attr_list
  - toc:
      permalink: true
