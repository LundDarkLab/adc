# Builds the MkDocs documentation and publishes it to GitHub Pages
# (gh-pages branch). Runs on every push to main that touches the docs.
#
# One-time repository setup: Settings → Pages → Source: "Deploy from a
# branch" → Branch: gh-pages / root.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write   # gh-deploy pushes to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install mkdocs-material

      - run: mkdocs gh-deploy --force
