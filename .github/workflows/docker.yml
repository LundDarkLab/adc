# Builds the web image and publishes it to the GitHub Container Registry
# (ghcr.io/lunddarklab/adc).
#
# Triggers:
#   - version tags (v1.0.0, v1.1.0, ...) -> tags the image 1.0.0, 1.0, latest
#   - manual run from the Actions tab (workflow_dispatch) -> tags it "edge"
#
# One-time repository setup after the first push: the package appears as
# private — make it public from the package settings (Packages → adc →
# Package settings → Change visibility).
name: docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lunddarklab/adc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
